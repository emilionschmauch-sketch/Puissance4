<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Puissance 4 IA</title>

<style>
/* Style du corps principal */
body {
            text-align : center;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff1010 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
/* Centrage du plateau de jeu */
table {
    margin: 20px auto;
}
/* Style des cases du jeu */
.case {
    width: 70px;
    height: 70px;
    border: 1px solid black;
    margin: 5px;
    background: white;
    cursor: pointer;
}
/* Style des boutons */
button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: rgb(233, 199, 4);
            border: none;
            border-radius: 5px;
            
            }
        /* Effet de survol sur les boutons */
        button:hover {
                transform: scale(1.05);
                transition: transform 0.2s;
            }
/* Classes pour les couleurs des pions */
.rouge { background: red; }
.jaune { background: yellow; }

/* Panneau de victoire qui s'affiche en superposition */
#victoire {
    position: fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    display:none;
    background: rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

/* Message de victoire au centre */
#message_victoire {
    background:white;
    padding:40px;
    border-radius:10px;
    font-size:30px;
}
</style>

<body>

<h1>Puissance 4</h1>
<h3>Réalisé par Emilion Schmauch</h3>
<div id="zone_jeu"></div>
<label>
    <input type="radio" name="ia" value="joueur" checked onclick="initialisation()">
    2 joueurs
</label>
<label>
    <input type="radio" name="ia" value="ia" onclick="initialisation()">
    Joueur vs IA
</label>
<div id="qui_commence">

    <label>
        <input type="radio" name="starter" value="joueur" checked onclick="initialisation()">
        Joueur commence
    </label>

    <label>
        <input type="radio" name="starter" value="ia" onclick="initialisation()">
        IA commence
    </label>   
</div>
<br>
<button onclick="initialisation()">Recommencer</button>

<br><br>

<div id="replay_controls" style="display:none;">
    <button onclick="rejouerPartie()">Revoir la partie</button>
    
    <br><br>
    
    <label>Vitesse replay :</label>
    <input
        type="range"
        id="speedSlider"
        min="200"
        max="2000"
        step="100"
        value="800"
    >
    
    <span id="speedValue">0.8s</span>
</div>

<div id="victoire" onclick="this.style.display='none'">
    <div id="message_victoire"></div>
</div>

<script>

// Variables globales du jeu
let tour = "rouge"; // Couleur du joueur actuel
let joueurIA = "jaune"; // Couleur de l'IA
let jeuFini = false; // Indicateur de fin de jeu
let ordre = [4,3,5,2,6,1,7]; // Ordre de priorité des colonnes pour l'IA
let historique = [];
let modeReplay = false;
const ROWS = 6;
const COLS = 7;
let board = [];

function initBoard(){
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function isColAvailable(boardState, col){
    return boardState[0][col-1] === null;
}

function getLowestEmptyRow(boardState, col){
    for (let r = ROWS - 1; r >= 0; r--) {
        if (boardState[r][col-1] === null) return r;
    }
    return -1;
}

function placeTempBoard(boardState, col, couleur){
    let row = getLowestEmptyRow(boardState, col);
    if (row === -1) return -1;
    boardState[row][col-1] = couleur;
    return row;
}

function removeTempBoard(boardState, row, col){
    if (row >= 0 && row < ROWS) {
        boardState[row][col-1] = null;
    }
}

function verifierBoard(boardState, couleur){
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (boardState[r][c] !== couleur) continue;

            if (r + 3 < ROWS &&
                boardState[r+1][c] === couleur &&
                boardState[r+2][c] === couleur &&
                boardState[r+3][c] === couleur) {
                return true;
            }

            if (c + 3 < COLS &&
                boardState[r][c+1] === couleur &&
                boardState[r][c+2] === couleur &&
                boardState[r][c+3] === couleur) {
                return true;
            }

            if (r + 3 < ROWS && c + 3 < COLS &&
                boardState[r+1][c+1] === couleur &&
                boardState[r+2][c+2] === couleur &&
                boardState[r+3][c+3] === couleur) {
                return true;
            }

            if (r - 3 >= 0 && c + 3 < COLS &&
                boardState[r-1][c+1] === couleur &&
                boardState[r-2][c+2] === couleur &&
                boardState[r-3][c+3] === couleur) {
                return true;
            }
        }
    }
    return false;
}


// Lancer le jeu
initialisation();

// Initialise ou réinitialise le jeu
function initialisation() { // Fonction qui initialise ou réinitialise le jeu

    jeuFini = false; // Réinitialiser l'indicateur de fin de jeu
    historique = []; // Réinitialiser l'historique des coups
    initBoard();

document.addEventListener("input", function(e){
    if(e.target.id === "speedSlider"){
        document.getElementById("speedValue").textContent =
            (e.target.value / 1000) + "s";
    }
});

document.getElementById("replay_controls").style.display = "none";

    if (document.querySelector('input[name="ia"]:checked').value === "ia"){ // Si l'IA est activée
    document.getElementById("qui_commence").style.display = "block"; // Afficher la section de choix du starter
}
else {
    document.getElementById("qui_commence").style.display = "none"; // Masquer la section de choix du joueur qui commence
}
    

    let choix = document.querySelector('input[name="starter"]:checked').value; // Récupérer la valeur du choix du joueur qui commence

    tour = (choix === "ia") ? joueurIA : "rouge"; // Définir le tour initial : IA ou rouge

    document.getElementById("zone_jeu").innerHTML = ""; // Vider le contenu de la zone de jeu

    let table = document.createElement("table"); // Créer un élément table pour le plateau

    for (let i=1;i<=6;i++){ // Boucle pour créer 6 lignes
        let tr=document.createElement("tr"); // Créer une ligne de table

        for (let j=1;j<=7;j++){ // Boucle pour créer 7 colonnes
            let td=document.createElement("td"); // Créer une cellule de table
            td.classList.add("case"); // Ajouter la classe CSS 'case' à la cellule
            td.id=i+""+j; // Définir l'identifiant unique de la cellule (ligne+colonne)
            if (document.querySelector('input[name="ia"]:checked').value === "ia"){ // Si le mode IA est activé
                td.addEventListener("click", jouer_avec_IA); // Ajouter l'événement de clic pour jouer contre l'IA
            }
            else {
                td.addEventListener("click", jouer); // Ajouter l'événement de clic pour jouer en mode 2 joueurs
            }
            tr.appendChild(td); // Ajouter la cellule à la ligne
        }

        table.appendChild(tr); // Ajouter la ligne à la table
    }

    document.getElementById("zone_jeu").appendChild(table); // Ajouter la table complète à la zone de jeu

    // 👉 SI IA commence, elle joue direct
    if (tour === joueurIA && document.querySelector('input[name="ia"]:checked').value === "ia"){ // Si c'est le tour de l'IA et le mode IA est activé
        setTimeout(jouerIA, 300); // Faire jouer l'IA automatiquement après 300 millisecondes
    }
}

// Gérer le coup du joueur contre l'IA
function jouer_avec_IA(e){
    if (jeuFini || tour===joueurIA) return; // Ignorer si jeu fini ou tour de l'IA

    let col = parseInt(e.target.id[1]); // Extraire le numéro de colonne
    jouerColonne(col); // Jouer la colonne
}


// Gère le coup d'un joueur en mode 2 joueurs
function jouer(event) {
    if (jeuFini) return; // Ignorer si le jeu est fini

    let td = event.target;
    let col = parseInt(td.id[1]); // Récupérer la colonne
    let cible = null;

    // Trouver la première case libre en bas de la colonne
    for (let l = 6; l >= 1; l--) {
        let cell = document.getElementById(l + "" + col);
        if (!cell.classList.contains('rouge') && !cell.classList.contains('jaune')) {
            cible = l;
            break;
        }
    }

    if (cible === null) return; // Colonne pleine, ignorer

    let couleur = tour;
    board[cible-1][col-1] = couleur;

if(!modeReplay){
    historique.push({
        col: col,
        couleur: couleur
    });
}

    // Animer la descente du pion et vérifier s'il y a victoire
    animerDescente(col, couleur, function() {
        if (!verifier_j()) {
            // Passer au joueur suivant
            tour = (couleur === 'rouge') ? 'jaune' : 'rouge';
        }
    });
}

// Vérifie la victoire en mode 2 joueurs
function verifier_j() {

    // Teste si 4 cases alignées contiennent la même couleur
    function test(c1, c2, c3, c4) {
        if (!c1 || !c2 || !c3 || !c4) return false; // Vérifier que toutes les cases existent

        // Vérifier si 4 cases rouges sont alignées
        if (c1.classList.contains('rouge') &&
            c2.classList.contains('rouge') &&
            c3.classList.contains('rouge') &&
            c4.classList.contains('rouge')) {
            victoire('Rouge');
            // Désactiver les clics
            document.querySelectorAll('.case').forEach(c => c.removeEventListener('click', jouer));
            return true;
        }

        // Vérifier si 4 cases jaunes sont alignées
        if (c1.classList.contains('jaune') &&
            c2.classList.contains('jaune') &&
            c3.classList.contains('jaune') &&
            c4.classList.contains('jaune')) {
            victoire('Jaune');
            document.querySelectorAll('.case').forEach(c => c.removeEventListener('click', jouer));
            return true;
        }

        return false; // Aucune victoire
    }

    // Parcourir toutes les cases pour vérifier 4 alignements
    let cases = document.getElementsByClassName('case');

    for (let i = 0; i < cases.length; i++) {
        let case1 = cases[i];
        let l = parseInt(case1.id[0]); // Numéro de ligne
        let c = parseInt(case1.id[1]); // Numéro de colonne

        // Vérifier vertical (bas)
        if (test(case1,
            document.getElementById((l+1)+''+c),
            document.getElementById((l+2)+''+c),
            document.getElementById((l+3)+''+c))) return true;

        // Vérifier horizontal (droite)
        if (test(case1,
            document.getElementById(l+''+(c+1)),
            document.getElementById(l+''+(c+2)),
            document.getElementById(l+''+(c+3)))) return true;

        // Vérifier diagonale vers bas-droit ↘
        if (test(case1,
            document.getElementById((l+1)+''+(c+1)),
            document.getElementById((l+2)+''+(c+2)),
            document.getElementById((l+3)+''+(c+3)))) return true;

        // Vérifier diagonale vers haut-droit ↗
        if (test(case1,
            document.getElementById((l-1)+''+(c+1)),
            document.getElementById((l-2)+''+(c+2)),
            document.getElementById((l-3)+''+(c+3)))) return true;
    }

    return false; // Pas de victoire trouvée
}    

// Anime la descente d'un pion colonne par colonne
function animerDescente(col, couleur, callback){
    // Trouver la position cible (première case libre en bas)
    let target = null;
    for (let l = 6; l >= 1; l--){
        let cell = document.getElementById(l+""+col);
        if (!cell.classList.contains('rouge') && !cell.classList.contains('jaune')){
            target = l;
            break;
        }
    }
    if (target === null) return; // Colonne pleine

    let ligne = 1; // Commencer du haut

    // Fonction récursive pour l'animation pas à pas
    function etape(){
        let cell = document.getElementById(ligne+""+col);
        cell.classList.add(couleur); // Colorer cette case

        // Effacer la case précédente pour créer l'effet de "chute"
        if (ligne > 1){
            let prev = document.getElementById((ligne-1)+""+col);
            prev.classList.remove(couleur);
        }

        // Si on a atteint la cible, fin de l'animation et callback
        if (ligne === target){
            callback(target);
        } else {
            // Continuer l'animation
            ligne++;
            setTimeout(etape, 100); // Attendre 100ms avant la prochaine étape
        }
    }

    etape(); // Démarrer l'animation
}

// Joue un coup dans une colonne (utilisé par l'IA et le joueur vs IA)
function jouerColonne(col){

    if (jeuFini) return;

    let cible = null;

    for(let l=6;l>=1;l--){
        let cell=document.getElementById(l+""+col);

        if(!cell.classList.contains("rouge") &&
           !cell.classList.contains("jaune")){

            cible = l;
            break;
        }
    }

    if (cible === null) return;

    let couleur = tour;
    board[cible-1][col-1] = couleur;

    if(!modeReplay){
        historique.push({
            col: col,
            couleur: couleur
        });
    }

    animerDescente(col, couleur, function(){

        if (verifier(couleur)){
            victoire(couleur);
            return;
        }

        tour = (couleur==="rouge") ? "jaune" : "rouge";

        if (tour === joueurIA && !modeReplay){
    setTimeout(jouerIA, 50);
}
    });
}

function getWindow(boardState, row, col, dr, dc){
    let window = [];
    for (let k = 0; k < 4; k++) {
        let r = row + dr*k;
        let c = col + dc*k;
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
        window.push(boardState[r][c]);
    }
    return window;
}

function scoreFenetre(window){
    let jaune = 0;
    let rouge = 0;
    let vide = 0;

    for (let c of window) {
        if (c === "jaune") jaune++;
        else if (c === "rouge") rouge++;
        else vide++;
    }

    if (jaune === 4) return 1000;
    if (rouge === 4) return -1000;
    if (jaune === 3 && vide === 1) return 50;
    if (jaune === 2 && vide === 2) return 10;
    if (rouge === 3 && vide === 1) return -80;
    if (rouge === 2 && vide === 2) return -15;
    return 0;
}

function evaluation(){
    let score = 0;

    for (let r = 0; r < ROWS; r++) {
        let cell = board[r][3];
        if (cell === "jaune") score += 6;
        if (cell === "rouge") score -= 6;
    }

    let directions = [
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            for (let [dr, dc] of directions) {
                let window = getWindow(board, r, c, dr, dc);
                if (!window) continue;
                score += scoreFenetre(window);
            }
        }
    }

    return score;
}

function minimaxRoot(profondeur){
    let meilleurScore = -Infinity;
    let meilleurCol = null;

    for (let col of ordre) {
        if (!isColAvailable(board, col)) continue;
        if (coupPerdant(col)) continue;

        let l = placeTempBoard(board, col, "jaune");
        if (l === -1) continue;

        let score = minimax(profondeur-1, false, -Infinity, Infinity);
        removeTempBoard(board, l, col);

        if (score > meilleurScore) {
            meilleurScore = score;
            meilleurCol = col;
        }
    }

    return meilleurCol;
}

function minimax(depth, isMaximizing, alpha, beta){
    if (verifierBoard(board, "jaune")) return 100000 - depth;
    if (verifierBoard(board, "rouge")) return -100000 + depth;

    if (depth === 0) {
        return evaluation();
    }

    if (isMaximizing) {
        let maxEval = -Infinity;

        for (let col of ordre) {
            if (!isColAvailable(board, col)) continue;

            let l = placeTempBoard(board, col, "jaune");
            if (l === -1) continue;

            let score = minimax(depth-1, false, alpha, beta);
            removeTempBoard(board, l, col);

            maxEval = Math.max(maxEval, score);
            alpha = Math.max(alpha, score);
            if (beta <= alpha) break;
        }

        return maxEval;
    } else {
        let minEval = Infinity;

        for (let col of ordre) {
            if (!isColAvailable(board, col)) continue;

            let l = placeTempBoard(board, col, "rouge");
            if (l === -1) continue;

            let score = minimax(depth-1, true, alpha, beta);
            removeTempBoard(board, l, col);

            minEval = Math.min(minEval, score);
            beta = Math.min(beta, score);
            if (beta <= alpha) break;
        }

        return minEval;
    }
}

/**
 * Stratégie de l'IA pour choisir le meilleur coup
 * Cette fonction implémente une hiérarchie de décisions pour l'IA :
 * 1. Cherche d'abord à gagner immédiatement
 * 2. Bloque la victoire immédiate du joueur
 * 3. Tente de créer une fourche (deux menaces simultanées)
 * 4. Bloque les fourches adverses
 * 5. Utilise l'algorithme minimax pour explorer les meilleurs coups
 */
function jouerIA(){
    if (jeuFini) return;

    // 1. GAGNER
    for (let col of ordre){
        let l = poserTemp(col,"jaune");
        if (l !== null && verifier("jaune")){
            retirerTemp(l,col);
            jouerColonne(col);
            return;
        }
        if (l !== null) retirerTemp(l,col);
    }

    // 2. BLOQUER
    for (let col of ordre){
        let l = poserTemp(col,"rouge");
        if (l !== null && verifier("rouge")){
            retirerTemp(l,col);
            jouerColonne(col);
            return;
        }
        if (l !== null) retirerTemp(l,col);
    }
// 3. CRÉER UNE FOURCHE
for (let col of ordre){
    if (detecterFourche(col,"jaune")&& !coupPerdant(col)){
        jouerColonne(col);
        return;
    }
}



    // 5. MINIMAX
    let col = minimaxRoot(7); // Profondeur de recherche

    if (col === null){ //Eviter bug en fin de partie
    // jouer première colonne dispo
    for (let c of ordre){
        if (colDisponible(c)){
            col = c;
            break;
        }
    }
}
    jouerColonne(col);
}

/**
 * Compte le nombre de pions d'une couleur spécifique dans une colonne donnée
 * Parcourt de haut en bas les 6 lignes de la colonne et compte les pions du joueur
 * Paramètres :
 * col (int) - Numéro de la colonne (1 à 7)
 * couleur (str) - Classe CSS de la couleur ("jaune" ou "rouge")
 * return (int) Le nombre de pions de cette couleur dans la colonne
 */
function evaluer(col, couleur){
    let score = 0;

    for(let l=1;l<=6;l++){
        let c = document.getElementById(l+""+col);
        if (c.classList.contains(couleur)) score++;
    }

    return score;
}

/**
 * Vérifie si une colonne a une place libre à la première ligne (en haut)
 * Une colonne est disponible si la case supérieure n'est pas occupée par un pion
 * Paramètre :
 * col (int) - Numéro de la colonne (1 à 7)
 * return (bool) - true si on peut placer un pion dans cette colonne, false sinon
 */
function colDisponible(col){
    let c = document.getElementById("1"+col);
    return !c.classList.contains("rouge") && !c.classList.contains("jaune");
}

/**
 * Place temporairement un pion dans une colonne pour explorer une position hypothétique
 * Cherche la première ligne libre (de bas en haut) et y place le pion
 * Utilisé par les algorithmes de recherche pour tester des coups sans les valider définitivement
 * Paramètres :
 * col (int) - Numéro de la colonne (1 à 7)
 * couleur (str) - Classe CSS du pion ("jaune" ou "rouge")
 * return (int|null) Le numéro de ligne où le pion a été placé, ou null si colonne pleine
 */
function poserTemp(col,couleur){
    for(let l=6;l>=1;l--){
        let c = document.getElementById(l+""+col);
        if (!c.classList.contains("rouge") && !c.classList.contains("jaune")){
            c.classList.add(couleur);
            return l; // Retourner la ligne où le pion a été placé
        }
    }
    return null; // Colonne pleine
}

/**
 * Retire temporairement un pion après avoir testé une position hypothétique
 * Inverse l'effet de la fonction poserTemp en supprimant les classes de couleur du pion
 * Utilisé pour explorer différentes branches de l'arbre de jeu
 * Paramètres :
 * l (int) - Numéro de ligne du pion à retirer
 * col (int) - Numéro de colonne du pion à retirer
 */
function retirerTemp(l,col){
    let c = document.getElementById(l+""+col);
    if (c) c.classList.remove("rouge","jaune");
}

/**
 * Vérifie si un joueur a gagné en trouvant 4 pions alignés de sa couleur
 * Teste les 4 directions possibles : vertical, horizontal, et deux diagonales
 * Parcourt toutes les cases du plateau et teste chaque position comme point de départ
 * Paramètre :
 * couleur (str) - Classe CSS de la couleur à vérifier ("jaune" ou "rouge")
 * return (bool) - true si 4 pions alignés de cette couleur existent, false sinon
 */
function verifier(couleur){

    let cases = document.getElementsByClassName("case");

    // Parcourir toutes les cases
    for(let i=0;i<cases.length;i++){

        let c1 = cases[i];
        let l = parseInt(c1.id[0]); // Ligne
        let c = parseInt(c1.id[1]); // Colonne

        // Teste si 4 cases contiennent la même couleur
        function ok(c2,c3,c4){
            return c1 && c2 && c3 && c4 &&
            c1.classList.contains(couleur) &&
            c2.classList.contains(couleur) &&
            c3.classList.contains(couleur) &&
            c4.classList.contains(couleur);
        }

        // Tester vertical
        if(ok(
            document.getElementById((l+1)+""+c),
            document.getElementById((l+2)+""+c),
            document.getElementById((l+3)+""+c))) return true;

        // Tester horizontal
        if(ok(
            document.getElementById(l+""+(c+1)),
            document.getElementById(l+""+(c+2)),
            document.getElementById(l+""+(c+3)))) return true;

        // Tester diagonale bas-droit
        if(ok(
            document.getElementById((l+1)+""+(c+1)),
            document.getElementById((l+2)+""+(c+2)),
            document.getElementById((l+3)+""+(c+3)))) return true;

        // Tester diagonale haut-droit
        if(ok(
            document.getElementById((l-1)+""+(c+1)),
            document.getElementById((l-2)+""+(c+2)),
            document.getElementById((l-3)+""+(c+3)))) return true;
    }

    return false; // Pas de victoire
}

/**
 * Affiche un message de victoire en superposition sur le plateau de jeu
 * Paramètre :
 * joueur (str) - Nom du gagnant ("jaune" ou "rouge")
 */
function affichermessage(joueur){
    let box = document.getElementById("victoire"); // Panneau en superposition
    let msg = document.getElementById("message_victoire"); // Message texte

    msg.textContent = "Victoire " + joueur; // Afficher le gagnant

    box.style.display = "flex"; // Montrer le panneau
}

/**
 * Gère la fin du jeu lors d'une victoire
 * Bloque tous les coups supplémentaires en mettant jeuFini à true
 * Affiche le message de victoire à l'écran
 * Paramètre :
 * joueur (str) - Couleur du gagnant ("jaune" ou "rouge")
 */
function victoire(joueur){
    jeuFini = true; // Bloquer les coups
    affichermessage(joueur); // Afficher le message

    document.getElementById("replay_controls").style.display = "block";
}



/**
 * Teste si un coup de l'IA permet au joueur d'obtenir une victoire immédiate au coup suivant
 * Simule le coup de l'IA puis teste tous les coups possibles du joueur après
 * Si le joueur peut gagner avec l'un de ses coups, ce coup de l'IA est un coup perdant
 * Paramètre :
 * col (int) - Colonne où l'IA envisage de placer son pion
 * return (bool) - true si ce coup perd immédiatement (victoire joueur au coup suivant), false sinon
 */
function coupPerdant(col){
    let l = placeTempBoard(board, col, "jaune");
    if (l === -1) return true;

    for (let c = 1; c <= 7; c++) {
        if (!isColAvailable(board, c)) continue;

        let l2 = placeTempBoard(board, c, "rouge");
        if (l2 !== -1) {
            if (verifierBoard(board, "rouge")) {
                removeTempBoard(board, l2, c);
                removeTempBoard(board, l, col);
                return true;
            }
            removeTempBoard(board, l2, c);
        }
    }

    removeTempBoard(board, l, col);
    return false;
}


/**
 * Détecte si un coup crée une fourche (deux menaces de victoire simultanées)
 * Simule le coup puis teste tous les coups suivants possibles
 * Compte combien de ces coups suivants créeraient une victoire immédiate
 * Paramètres :
 * col (int) - Colonne où le pion serait placé
 * couleur (str) - Couleur du pion ("jaune" ou "rouge")
 * return (bool) - true si ce coup crée une fourche (2+ menaces simultanées), false sinon
 */
function detecterFourche(col, couleur){
    let l = placeTempBoard(board, col, couleur);
    if (l === -1) return false;

    let menaces = 0;
    for (let c = 1; c <= 7; c++) {
        if (!isColAvailable(board, c)) continue;

        let l2 = placeTempBoard(board, c, couleur);
        if (l2 !== -1 && verifierBoard(board, couleur)) {
            menaces++;
        }
        if (l2 !== -1) removeTempBoard(board, l2, c);
    }

    removeTempBoard(board, l, col);
    return menaces >= 2;
}

function rejouerPartie(){

    if(historique.length === 0) return;

    let coups = [...historique];

    modeReplay = true;
    jeuFini = true; // bloquer tous les clics
    tour = null; // empêcher l'IA de rejouer seule

    // reset visuel uniquement
    document.querySelectorAll(".case").forEach(c=>{
        c.classList.remove("rouge","jaune");
    });

    document.getElementById("victoire").style.display = "none";

    let vitesse = parseInt(
        document.getElementById("speedSlider").value
    );

    vitesse = Math.max(vitesse,700);

    let i = 0;

    function jouerReplay(){

        if(i >= coups.length){
            modeReplay = false;
            jeuFini = false;
            return;
        }

        let coup = coups[i];

        console.log("Replay coup :", coup);

        animerDescente(
            coup.col,
            coup.couleur,
            function(){

                i++;

                setTimeout(function(){
                    jouerReplay();
                }, vitesse);

            }
        );
    }

    jouerReplay();
    if(i >= coups.length){
    modeReplay = false;
    jeuFini = false;
    return;
}
}
